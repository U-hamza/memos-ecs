name: Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read # Allows Github Actions to check repo
  id-token: write # Allows Github actions to get OIDC token

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: memos-ecs

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init - ECR
        working-directory: infra/ecr-bootstrap
        run: terraform init

      - name: Terraform Apply - ECR
        working-directory: infra/ecr-bootstrap
        run: terraform apply -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 # Authenticates Docker with ECR registry

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA}" ./app

      - name: Push Docker image
        run: |
          docker push \
            "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA}"

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region "${AWS_REGION}"
